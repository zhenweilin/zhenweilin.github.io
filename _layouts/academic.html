<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% unless page.url == '/' %}{{ page.title | escape }} · {% endunless %}{{ site.name | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | default: site.name | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/profile.png' | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/monogram.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Zhenwei Lin — home">ZL<span class="wordmark-dot">.</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>
    <main id="main" class="wrap" tabindex="-1">{{ content }}</main>
    <footer class="site-footer wrap">
      <p>© {{ site.time | date: '%Y' }} Zhenwei Lin</p>
      <div><a href="mailto:{{ site.author.email }}">Email</a><a href="{{ site.author.googlescholar | escape }}">Google Scholar <span aria-hidden="true">↗</span></a><a href="https://github.com/{{ site.author.github }}">GitHub <span aria-hidden="true">↗</span></a></div>
    </footer>
  </body>
</html>
